# 影视下载台 · media 栈
# 用法： cp .env.example .env  &&  docker compose up -d
# 起来后打开 http://<本机IP>:8787 ，在页面填入你的境外 HTTP 代理即可出外网。
# 不填 = 直连出网（无需代理）；仅当宿主机本身无法直连外网时，才在此填代理。

services:
  # ---- 出网出口（HTTP 代理转发器）----
  proxy-forwarder:
    image: ubuntu/squid:latest
    container_name: proxy-forwarder
    ports:
      - "3128:3128"
    volumes:
      - ./.env:/opt/media/.env:ro
      - ./squid/squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./squid/entrypoint.sh:/opt/media/entrypoint.sh:ro
    # 必须用 entrypoint 覆盖 ubuntu/squid 镜像自带的 ENTRYPOINT，
    # 否则镜像的 entrypoint.sh 会把我们的脚本当成 squid 参数，导致 squid 后台化后父进程退出 0、无限重启。
    entrypoint: ["sh", "/opt/media/entrypoint.sh"]
    restart: unless-stopped

  # ---- 统一控制台（影视下载台）----
  autopilot:
    build: ./autopilot
    container_name: autopilot
    ports:
      - "${AUTOPILOT_PORT:-8787}:8787"
    environment:
      - AUTOPILOT_PORT=8787
      - AUTOPILOT_TOKEN=${AUTOPILOT_TOKEN:-}
      - EGRESS_PROXY=${EGRESS_PROXY:-}
      - MEDIA_ENV=/app/.env
      - QBITTORRENT_URL=http://media-qbittorrent:8085
      - QBITTORRENT_USER=${QBITTORRENT_USER:-admin}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS:-MediaFn2026}
      # NAS 完整面板所需的服务地址（WSL 容器名带 media- 前缀，config.xml 挂载进容器）
      - RADARR_URL=http://media-radarr:7878
      - RADARR_CONFIG=/radarr-config/config.xml
      - SONARR_URL=http://media-sonarr:8989
      - SONARR_CONFIG=/sonarr-config/config.xml
      - PROWLARR_URL=http://media-prowlarr:9696
      - PROWLARR_CONFIG=/prowlarr-config/config.xml
      - FLARESOLVERR_URL=http://media-flaresolverr:8191
      - PROXY_URL=${PROXY_URL:-}
      - TMDB_PROXY=${TMDB_PROXY:-}
    volumes:
      - ./.env:/app/.env
      - ./data:/data
      - ./autopilot/app.py:/app/app.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /usr/bin/docker:/usr/bin/docker:ro
      - ./radarr-config:/radarr-config:ro
      - ./sonarr-config:/sonarr-config:ro
      - ./prowlarr-config:/prowlarr-config:ro
    restart: unless-stopped

  # ---- 索引器 / 媒体管理 ----
  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: media-flaresolverr
    environment:
      - HTTP_PROXY=http://proxy-forwarder:3128
      - HTTPS_PROXY=http://proxy-forwarder:3128
      # 本地回环不能走代理：flaresolverr 自检会访问 localhost 会话端口，
      # 若经 squid（此时可能无上游）= ERR_READ_ERROR → 启动失败 → 崩溃循环。
      # 无外网时让它稳定 running（外网本就无从可达），配好出口后自然可用。
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
    ports:
      - "8191:8191"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: media-prowlarr
    environment:
      - HTTP_PROXY=http://proxy-forwarder:3128
      - HTTPS_PROXY=http://proxy-forwarder:3128
    ports:
      - "9696:9696"
    volumes:
      - ./data:/data
      - ./prowlarr-config:/config
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: media-radarr
    environment:
      - HTTP_PROXY=http://proxy-forwarder:3128
      - HTTPS_PROXY=http://proxy-forwarder:3128
    ports:
      - "7878:7878"
    volumes:
      - ./data:/data
      - ./radarr-config:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: media-sonarr
    environment:
      - HTTP_PROXY=http://proxy-forwarder:3128
      - HTTPS_PROXY=http://proxy-forwarder:3128
    ports:
      - "8989:8989"
    volumes:
      - ./data:/data
      - ./sonarr-config:/config
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: media-qbittorrent
    environment:
      - WEBUI_PORT=8085
      # 持久化 WebUI 管理员账号，避免匿名 /config 卷重启后丢失密码 → 系统状态红灯
      - WEBUI_USERNAME=admin
      - WEBUI_PASSWORD=MediaFn2026
    ports:
      - "8085:8085"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./data:/data
      - ./qbittorrent-config:/config
    restart: unless-stopped
